# =====================================================================
# Drug Interaction Checker - Backend configuration
# All secrets come from environment variables. Never hardcode credentials.
# =====================================================================

# --- Database (MySQL when configured; H2 fallback for local dev) ---
spring.datasource.url=${DB_URL:jdbc:h2:mem:drug_interaction_checker;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# --- JPA / Hibernate ---
# validate/update in prod; create-only for first local run, see README
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}

# data.sql is demo/sample data only - see data.sql header
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# --- AI Service (Python Flask) ---
ai.service.url=${AI_SERVICE_URL:http://localhost:5000}

# --- Server ---
server.port=${SERVER_PORT:8080}

# --- Never leak stack traces to clients ---
server.error.include-message=always
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# --- CORS (tighten allowed-origins for production) ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:5500}

# --- Logging ---
logging.level.com.example.drugchecker=INFO
logging.level.org.hibernate.SQL=WARN
