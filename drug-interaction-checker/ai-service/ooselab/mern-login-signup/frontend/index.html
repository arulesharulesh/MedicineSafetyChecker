<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Sign in to your account."
    />
    <title>Sign in</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./app.js" defer></script>
  </head>
  <body>
    <main class="page">
      <section class="login-card" aria-labelledby="page-title">
        <a class="brand" href="./" aria-label="MERN Login home">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <path
                d="M12 3.5 19 6v5.1c0 4.5-2.9 7.8-7 9.4-4.1-1.6-7-4.9-7-9.4V6l7-2.5Z"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linejoin="round"
              />
              <path
                d="m9 12.1 2 2 4-4.2"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </span>
          <span>MERN Login</span>
        </a>

        <div class="intro">
          <p class="eyebrow">YOUR ACCOUNT</p>
          <h1 id="page-title">Welcome back</h1>
          <p class="subtitle">Sign in with your email and password to continue.</p>
        </div>

        <form id="login-form">
          <div class="field">
            <label for="email">Email address</label>
            <input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              placeholder="you@example.com"
              required
            />
          </div>

          <div class="field">
            <div class="label-row">
              <label for="password">Password</label>
            </div>
            <div class="password-input">
              <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                placeholder="Enter your password"
                required
              />
              <button
                class="password-toggle"
                id="password-toggle"
                type="button"
                aria-label="Show password"
                aria-pressed="false"
              >
                Show
              </button>
            </div>
          </div>

          <p class="message" id="form-message" role="status" aria-live="polite" hidden></p>

          <button class="submit-button" id="submit-button" type="submit">
            <span class="button-label">Sign in</span>
            <span class="button-spinner" aria-hidden="true"></span>
          </button>
        </form>

        <p class="footer-note">Secure sign in to your account</p>
      </section>
    </main>
  </body>
</html>
